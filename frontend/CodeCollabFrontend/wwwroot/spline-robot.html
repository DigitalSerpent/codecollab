<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Perfect Slow Jellyfish</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050515; }
        canvas { display: block; width: 100%; height: 100%; cursor: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const pos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const tentacleCount = 12;
        const segmentCount = 20;
        const tentacles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Передача координат из iframe
        window.addEventListener('message', (e) => {
            if (e.data.type === 'mousemove') {
                mouse.x = e.data.x;
                mouse.y = e.data.y;
            }
        });

        for (let i = 0; i < tentacleCount; i++) {
            const segments = [];
            for (let j = 0; j < segmentCount; j++) {
                segments.push({ x: pos.x, y: pos.y });
            }
            tentacles.push(segments);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#050515';
            ctx.fillRect(0, 0, width, height);

            pos.x += (mouse.x - pos.x) * 0.04;
            pos.y += (mouse.y - pos.y) * 0.04;

            const time = Date.now() * 0.002; 
            const pulse = Math.sin(time) * 8;

            tentacles.forEach((segments, i) => {
                const angle = (i / tentacleCount) * Math.PI * 2;
                const rootX = pos.x + Math.cos(angle) * (30 + pulse);
                const rootY = pos.y + Math.sin(angle) * (20 + pulse);

                ctx.beginPath();
                ctx.moveTo(rootX, rootY);

                segments.forEach((seg, j) => {
                    const target = j === 0 ? { x: rootX, y: rootY } : segments[j - 1];
                    
                    seg.x += (target.x - seg.x) * 0.2 + Math.sin(time + j * 0.4) * 0.4;
                    seg.y += (target.y - seg.y) * 0.2 + 0.3; 

                    ctx.lineTo(seg.x, seg.y);
                });

                ctx.strokeStyle = `hsla(${190 + pulse}, 100%, 70%, ${0.4 - i * 0.01})`;
                ctx.lineWidth = 1.8;
                ctx.stroke();
            });

            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate((mouse.x - pos.x) * 0.03);

            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 60 + pulse);
            grad.addColorStop(0, 'rgba(0, 255, 255, 0.6)');
            grad.addColorStop(1, 'rgba(0, 100, 255, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, 55 + pulse, Math.PI, 0); 
            ctx.fill();

            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.beginPath();
            ctx.arc(-15, -12, 2.5, 0, Math.PI * 2);
            ctx.arc(15, -12, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            requestAnimationFrame(draw);
        }

        resize();
        draw();
    </script>
</body>
</html>
